name: Debian package build

on:
  push:
    paths:
      - 'debian/**'
      - 'Makefile'
      - 'dool'
      - 'plugins/**'
      - 'docs/dool.1'
      - '.github/workflows/deb-build.yaml'
  pull_request:
    paths:
      - 'debian/**'
      - 'Makefile'
      - 'dool'
      - 'plugins/**'
      - 'docs/dool.1'
      - '.github/workflows/deb-build.yaml'
  workflow_dispatch:

jobs:
  build-deb:
    name: Build and install .deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential debhelper devscripts

      - name: Build package
        run: make deb

      - name: Locate built package
        id: pkg
        run: |
          pkg=$(ls ../dool_*.deb)
          echo "path=$pkg" >> "$GITHUB_OUTPUT"

      - name: Assert no files land outside usr/ (regression check for #4)
        run: |
          bad=$(dpkg -c "${{ steps.pkg.outputs.path }}" | awk '{print $NF}' | grep -v '^\./$' | grep -vE '^\./usr/' || true)
          if [ -n "$bad" ]; then
            echo "Package installs files outside of usr/:"
            echo "$bad"
            exit 1
          fi

      - name: Install package
        run: sudo dpkg -i "${{ steps.pkg.outputs.path }}"

      - name: Smoke test installed binary
        run: |
          which dool
          dool --version
          dool -taf 1 3

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: dool-deb
          path: ${{ steps.pkg.outputs.path }}
