name: CI

on:
  push:
  pull_request:

jobs:
  syntax-check:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile dool and every plugin
        run: |
          python3 -m py_compile dool
          for f in plugins/*.py; do
            python3 -m py_compile "$f"
          done

  smoke-test:
    name: Smoke test
    runs-on: ubuntu-latest
    needs: syntax-check
    steps:
      - uses: actions/checkout@v4
      - run: make test
