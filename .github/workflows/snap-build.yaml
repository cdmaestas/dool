name: Snap package build

on:
  push:
    paths:
      - 'packaging/snap/**'
      - 'dool'
      - 'plugins/**'
      - '.github/workflows/snap-build.yaml'
  pull_request:
    paths:
      - 'packaging/snap/**'
      - 'dool'
      - 'plugins/**'
      - '.github/workflows/snap-build.yaml'
  workflow_dispatch:

jobs:
  build-snap:
    name: Build and install .snap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build snap
        uses: snapcore/action-build@v1
        id: build
        with:
          path: packaging/snap

      - name: Install snap
        run: sudo snap install --dangerous "${{ steps.build.outputs.snap }}"

      - name: Connect interfaces
        run: |
          sudo snap connect dool:system-observe
          sudo snap connect dool:mount-observe
          sudo snap connect dool:hardware-observe
          sudo snap connect dool:network-observe

      - name: Smoke test installed binary
        run: |
          dool --version
          dool -taf 1 3

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: dool-snap
          path: ${{ steps.build.outputs.snap }}
