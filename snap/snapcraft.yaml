name: dool
base: core22
summary: Versatile resource statistics tool (a Python 3 successor to dstat)
description: |
  Dool is a versatile replacement for vmstat, iostat, netstat and ifstat.
  Dool overcomes some of their limitations and adds some extra features,
  more counters and flexibility. Dool is handy for monitoring systems
  during performance tuning tests, benchmarks or troubleshooting.
grade: stable
confinement: strict
adopt-info: dool

apps:
  dool:
    command: usr/bin/dool
    # These grant read-only access to the /proc and /sys data behind the
    # built-in plugins (cpu, disk, net, load, etc). Optional third-party
    # plugins that need extra sockets, config files, or external binaries
    # (e.g. mysql, mongodb, gpfs) are not expected to work under strict
    # confinement; they already fail gracefully via their own check()
    # methods when the resource they need isn't reachable.
    plugs:
      - home
      - system-observe
      - mount-observe
      - hardware-observe
      - network-observe

parts:
  dool:
    plugin: dump
    source: .
    # Derive the snap version from the same __version__ string the
    # Debian/RPM packaging scripts already read, so it can't drift.
    override-pull: |
      craftctl default
      craftctl set version="$(grep "__version__ = " dool | sed -E "s/.*'([^']+)'.*/\1/")"
    organize:
      dool: usr/bin/dool
      plugins: usr/share/dool
    stage:
      - usr/bin/dool
      - usr/share/dool/*
    stage-packages:
      - python3
